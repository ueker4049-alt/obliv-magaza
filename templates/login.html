{% extends "base.html" %}

{% block title %}Giriş Yap | OBLIV{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 60px auto 140px; padding: 40px; background: #0E0F13; border: 1px solid var(--border-hairline); border-radius: 16px;">
  <div style="text-align: center; margin-bottom: 30px;">
    <div style="display: flex; justify-content: center; margin-bottom: 16px;">
      <img src="/static/images/obliv_brand_official.png?v=20261008_cobalt_blue" alt="OBLIV" style="height: 52px; width: auto; filter: drop-shadow(0 0 16px rgba(34, 76, 175, 0.7));">
    </div>
    <h1 style="font-family: var(--font-display); font-size: 28px; font-weight: 900; letter-spacing: 0.05em; text-transform: uppercase;">
      HESABINIZA GİRİŞ YAPIN
    </h1>
    <p style="font-size: 13px; color: var(--text-dim); margin-top: 4px;">Siparişlerinizi ve sepetinizi yönetin</p>
  </div>

  <form method="POST" action="/login">
    <div class="form-group">
      <label class="form-label" for="login-email">E-Posta Adresi</label>
      <input type="email" id="login-email" name="email" class="form-control" required placeholder="adiniz@email.com">
    </div>

    <div class="form-group">
      <label class="form-label" for="login-password">Şifre</label>
      <input type="password" id="login-password" name="password" class="form-control" required placeholder="••••••••">
    </div>

    <button type="submit" class="btn-drip-primary" style="width: 100%; justify-content: center; padding: 16px; margin-top: 10px; font-size: 13px;">
      GİRİŞ YAP →
    </button>
  </form>

  <div style="text-align: center; margin-top: 24px; font-size: 13px; color: var(--text-muted);">
    Henüz hesabınız yok mu? <a href="/register" style="color: #FFFFFF; font-weight: 700; text-decoration: underline; margin-left: 4px;">Hemen Kayıt Olun</a>
  </div>
</div>
{% endblock %}
